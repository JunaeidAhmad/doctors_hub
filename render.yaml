services:
  - type: web
    name: doctors-hub
    runtime: python
    rootDir: doctors_hub_backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false          # set in dashboard, never in repo
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: doctors-hub.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # your Vercel domain(s), with scheme
