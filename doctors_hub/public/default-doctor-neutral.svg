<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="neutral-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="coat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="silhouette-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="scrub-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008378"/>
      <stop offset="100%" stop-color="#00685f"/>
    </linearGradient>
  </defs>

  <!-- Background rounded card -->
  <rect width="120" height="120" rx="16" fill="url(#neutral-bg)"/>
  <rect width="120" height="120" rx="16" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Neutral Doctor Figure -->
  <g id="doctor-neutral">
    <!-- Lab Coat Shoulders -->
    <path d="M18 120 C18 94, 35 82, 60 82 C85 82, 102 94, 102 120 Z" fill="url(#coat-grad)" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Inner Scrub -->
    <path d="M48 82 L60 100 L72 82 Z" fill="url(#scrub-teal)"/>

    <!-- Coat Lapels -->
    <path d="M35 82 L52 106 L50 120 L24 120 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <path d="M85 82 L68 106 L70 120 L96 120 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Stethoscope -->
    <path d="M46 84 C44 98, 49 106, 55 106 C58 106, 60 103, 60 100" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M74 84 C76 98, 71 106, 65 106" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="54" cy="108" r="3.5" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
    <circle cx="54" cy="108" r="1.5" fill="#008378"/>

    <!-- Head and Neck Silhouette -->
    <path d="M52 66 H68 V82 H52 Z" fill="#cbd5e1"/>
    <circle cx="60" cy="46" r="18" fill="url(#silhouette-grad)"/>
  </g>
</svg>
