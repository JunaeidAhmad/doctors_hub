<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="male-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="coat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="skin-male" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="hair-male" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="scrub-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008378"/>
      <stop offset="100%" stop-color="#00685f"/>
    </linearGradient>
  </defs>

  <!-- Background rounded card -->
  <rect width="120" height="120" rx="16" fill="url(#male-bg)"/>
  <rect width="120" height="120" rx="16" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Male Doctor Silhouette & Uniform -->
  <g id="doctor-figure">
    <!-- Lab Coat Shoulders -->
    <path d="M16 120 C16 94, 34 82, 60 82 C86 82, 104 94, 104 120 Z" fill="url(#coat-grad)" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Inner Scrub / Shirt -->
    <path d="M47 82 L60 102 L73 82 Z" fill="url(#scrub-teal)"/>
    <path d="M56 82 L60 88 L64 82 Z" fill="#ffffff" opacity="0.9"/>

    <!-- Coat Lapels -->
    <path d="M34 82 L52 108 L50 120 L24 120 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <path d="M86 82 L68 108 L70 120 L96 120 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Stethoscope -->
    <path d="M45 84 C43 98, 48 107, 54 107 C57 107, 59 104, 59 100" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M75 84 C77 98, 72 107, 66 107" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="53" cy="109" r="3.5" fill="#94a3b8" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="53" cy="109" r="1.5" fill="#00685f"/>

    <!-- Neck -->
    <path d="M51 64 H69 V82 H51 Z" fill="url(#skin-male)"/>

    <!-- Head / Face Silhouette -->
    <ellipse cx="60" cy="50" rx="17" ry="21" fill="url(#skin-male)"/>

    <!-- Hair Silhouette -->
    <path d="M43 45 C43 30, 49 25, 60 25 C71 25, 77 30, 77 45 C77 34, 72 31, 60 31 C48 31, 44 36, 43 45 Z" fill="url(#hair-male)"/>
    
    <!-- Subtle Modern Facial Contours -->
    <path d="M49 47 Q53 45 57 47" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M63 47 Q67 45 71 47" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="53" cy="51" r="1.8" fill="#334155"/>
    <circle cx="67" cy="51" r="1.8" fill="#334155"/>
    
    <!-- Glasses (Refined Clinical Spec) -->
    <rect x="47" y="47" width="11" height="8" rx="2.5" fill="none" stroke="#00685f" stroke-width="1.2"/>
    <rect x="62" y="47" width="11" height="8" rx="2.5" fill="none" stroke="#00685f" stroke-width="1.2"/>
    <line x1="58" y1="51" x2="62" y2="51" stroke="#00685f" stroke-width="1.2"/>
    
    <!-- Smile & Nose -->
    <path d="M60 52 L59 56 L61 56" fill="none" stroke="#64748b" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M55 60 Q60 64 65 60" fill="none" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>