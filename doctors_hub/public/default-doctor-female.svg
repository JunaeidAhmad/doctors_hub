<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="female-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="50%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="coat-grad-f" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="skin-female" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="hair-female" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="scrub-teal-f" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#00685f"/>
    </linearGradient>
  </defs>

  <!-- Background rounded card -->
  <rect width="120" height="120" rx="16" fill="url(#female-bg)"/>
  <rect width="120" height="120" rx="16" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Female Doctor Silhouette & Uniform -->
  <g id="doctor-female-figure">
    <!-- Hair Back Layers -->
    <path d="M37 45 C35 64, 34 76, 42 84 C45 76, 45 60, 45 48 Z" fill="url(#hair-female)"/>
    <path d="M83 45 C85 64, 86 76, 78 84 C75 76, 75 60, 75 48 Z" fill="url(#hair-female)"/>

    <!-- Lab Coat Shoulders -->
    <path d="M18 120 C18 94, 34 82, 60 82 C86 82, 102 94, 102 120 Z" fill="url(#coat-grad-f)" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Inner Scrub / Shirt -->
    <path d="M48 82 L60 100 L72 82 Z" fill="url(#scrub-teal-f)"/>
    <path d="M57 82 L60 87 L63 82 Z" fill="#ffffff" opacity="0.9"/>

    <!-- Coat Lapels -->
    <path d="M36 82 L52 106 L50 120 L26 120 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <path d="M84 82 L68 106 L70 120 L94 120 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Stethoscope -->
    <path d="M46 84 C44 97, 49 105, 54 105 C57 105, 59 102, 59 98" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M74 84 C76 97, 71 105, 66 105" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="53" cy="107" r="3.5" fill="#94a3b8" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="53" cy="107" r="1.5" fill="#0284c7"/>

    <!-- Neck -->
    <path d="M52 64 H68 V82 H52 Z" fill="url(#skin-female)"/>

    <!-- Head / Face Silhouette -->
    <ellipse cx="60" cy="50" rx="16" ry="20" fill="url(#skin-female)"/>

    <!-- Hair Silhouette (Front & Bangs) -->
    <path d="M42 45 C42 28, 48 24, 60 24 C72 24, 78 28, 78 45 C73 34, 68 30, 60 30 C50 30, 46 36, 42 45 Z" fill="url(#hair-female)"/>
    <path d="M42 40 Q50 32 60 35 Q70 32 78 40 Q74 27 60 26 Q46 27 42 40 Z" fill="#1e293b"/>
    
    <!-- Subtle Modern Facial Contours -->
    <path d="M49 48 Q53 46 57 48" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M63 48 Q67 46 71 48" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="53" cy="51" r="1.8" fill="#334155"/>
    <circle cx="67" cy="51" r="1.8" fill="#334155"/>
    
    <!-- Smile & Nose -->
    <path d="M60 52 L59 55 L61 55" fill="none" stroke="#64748b" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M55 59 Q60 63 65 59" fill="none" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>