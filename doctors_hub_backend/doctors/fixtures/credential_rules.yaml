# Credential Validation Rules (regex patterns over qualification text, case-insensitive)
rules:
  - group_name: "Surgeon leaves"
    leaf_slugs:
      - general-surgeon
      - laparoscopic-surgeon
      - colorectal-surgeon
      - breast-surgeon
      - cancer-surgeon
      - neurosurgeon
      - spine-surgeon
      - orthopedic-surgeon
      - cardiac-surgeon
      - vascular-surgeon
      - thoracic-surgeon
      - pediatric-surgeon
      - plastic-surgeon
      - hepatobiliary-surgeon
      - head-neck-surgeon
      - pediatric-orthopedic-surgeon
      - pediatric-neurosurgeon
    pattern: 'FCPS\s*\(?Surg|MS\b|FRCS|MCh|M\.?S\.?\s*\(|Diploma.*Surg|FMAS|FICS'

  - group_name: "Cancer Specialist"
    leaf_slugs:
      - cancer-specialist
      - gynecological-oncologist
      - pediatric-oncologist
    pattern: 'Oncolog|Radioth|FRCR|DMRT|MD\s*\(?Onc'

  - group_name: "Cardiologist"
    leaf_slugs:
      - cardiologist
      - interventional-cardiologist
      - pediatric-cardiologist
    pattern: 'Cardio|MD\s*\(?Card|D-?Card|FCPS\s*\(?Med|MRCP|FRCP'

  - group_name: "Child Specialist / Pediatric leaves"
    leaf_slugs:
      - child-specialist
      - neonatologist
      - pediatric-surgeon
      - pediatric-cardiologist
      - pediatric-neurologist
      - pediatric-oncologist
      - pediatric-orthopedic-surgeon
      - pediatric-gastroenterologist
      - pediatric-pulmonologist
      - pediatric-neurosurgeon
      - pediatric-urologist
    pattern: 'Paed|Ped|DCH|FCPS\s*\(?Paed|MD\s*\(?Paed'

  - group_name: "Gynecologist & Obstetrician"
    leaf_slugs:
      - gynecologist-obstetrician
      - infertility-specialist
      - gynecological-oncologist
      - fetomaternal-medicine-specialist
    pattern: 'Gyn|Obs|DGO|MRCOG|FCPS\s*\(?Gyn|LM\b'

  - group_name: "Nutritionist / Dietitian"
    leaf_slugs:
      - nutritionist-dietitian
    pattern: 'Nutrition|Dietet|MPH|M\.?Sc|B\.?Sc|MBBS'
